name: Bug report
description: Something in Odys UI doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Kestrel Ridge demo project
        2. Go to Runs → New run
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors or screenshots
      description: Browser console errors, backend logs or screenshots, if any.
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, browser, Node and Python versions, commit"
